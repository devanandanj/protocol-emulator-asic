# Tiny Tapeout project information
project:
  title:        "Protocol Emulator (PEmu)"
  author:       "Devanandan J"
  discord:      ""
  description:  "Programmable pin-bit-banging core that emulates UART, SPI, I2C via firmware"
  language:     "Verilog"
  clock_hz:     50000000

  # 6x4 is the competition's required tile size. Program memory is a
  # 256x16 IHP SRAM macro (see src/config.json), not flip-flops.
  tiles: "6x4"

  top_module:  "tt_um_devanandanj_pemu"

  source_files:
    - "project.v"
    - "pemu_core.v"
    - "pemu_host.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Dedicated inputs — the SPI host port (mode 0, SCK at most clk/8).
  ui[0]: "host SCK"
  ui[1]: "host MOSI"
  ui[2]: "host CS_N (idle high)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Dedicated outputs — host port. uo[2..7] are tied to 0.
  uo[0]: "host MISO"
  uo[1]: "IRQ (high while any IRQ line is set)"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins — programmable I/O the running program drives/reads.
  uio[0]: "pin 0 (uart_tx TX, spi SCK)"
  uio[1]: "pin 1 (spi MOSI)"
  uio[2]: "pin 2 (spi MISO)"
  uio[3]: "pin 3 (uart_rx RX, i2c SDA)"
  uio[4]: "pin 4 (i2c SCL)"
  uio[5]: "pin 5 (ps2 CLK)"
  uio[6]: "pin 6 (ps2 DATA)"
  uio[7]: "pin 7"

# Do not change!
yaml_version: 6
