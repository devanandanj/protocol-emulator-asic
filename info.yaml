# Tiny Tapeout project information
project:
  title:        "Protocol Emulator (PEmu)"
  author:       "Devanandan J"
  discord:      ""
  description:  "Programmable pin-bit-banging core that emulates UART, SPI, I2C via firmware"
  language:     "Verilog"
  clock_hz:     50000000

  # Rough FF budget: 12-bit PC, 8×8-bit regs, 64×16-bit program mem,
  # 2×(16×8-bit FIFOs), 16-bit IRQ, 8-bit pin_out/pin_oe, small FSMs.
  # ~1500 FFs total, so 4x2 is a comfortable first-cut floorplan. Bump to
  # 8x2 or 8x4 if utilization or timing forces it.
  tiles: "4x2"

  top_module:  "tt_um_devanandanj_pemu"

  source_files:
    - "project.v"
    - "pemu_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Dedicated inputs — reserved for the program loader while rst_n=0.
  # After reset is released, ui[3..7] are ignored; ui[0..2] are also
  # only meaningful during the load phase.
  ui[0]: "prog_we (loader write strobe, rst_n=0 only)"
  ui[1]: "prog_hi (loader byte-half select, 0=low 1=high)"
  ui[2]: "prog_rst (loader address reset)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Dedicated outputs — not currently used, tied to 0.
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins — programmable I/O the running program drives/reads.
  # During load (rst_n=0), uio_in doubles as the program-byte data bus.
  uio[0]: "pin 0 (uart_tx TX, spi SCK)"
  uio[1]: "pin 1 (spi MOSI)"
  uio[2]: "pin 2 (spi MISO)"
  uio[3]: "pin 3 (uart_rx RX, i2c SDA)"
  uio[4]: "pin 4 (i2c SCL)"
  uio[5]: "pin 5"
  uio[6]: "pin 6"
  uio[7]: "pin 7"

# Do not change!
yaml_version: 6
